name: Create GitHub release after QGIS approval

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

env:
  PLUGIN_DIRECTORY: "qgis2mapbender"

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: |
          python -m pip install \
            "bandit~=1.9" \
            "detect-secrets~=1.5" \
            "flake8~=7.3"

      - name: Validate tag and metadata version
        env:
          PLUGIN_DIRECTORY: ${{ env.PLUGIN_DIRECTORY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

          METADATA_VERSION="$(sed -n 's/^version=\(.*\)$/\1/p' \
            "${PLUGIN_DIRECTORY}/metadata.txt")"

          if [[ "${METADATA_VERSION}" != "${VERSION}" ]]; then
            echo "Tag version ${VERSION} does not match metadata version ${METADATA_VERSION}."
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Run security and quality checks
        env:
          PLUGIN_DIRECTORY: ${{ env.PLUGIN_DIRECTORY }}
        run: |
          bash .github/scripts/check-qgis-quality.sh "${PLUGIN_DIRECTORY}"

      - name: Find submitted QGIS package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          QGIS_RUN_ID="$(
            gh run list \
              --workflow "qgis-submit.yml" \
              --status completed \
              --limit 100 \
              --json databaseId,conclusion,createdAt,headSha \
              --jq 'sort_by(.createdAt) | reverse | .[] |
                select(.conclusion == "success") |
                select(.headSha == env.TAG_COMMIT) |
                .databaseId' \
              | head -n 1
          )"

          if [[ -z "${QGIS_RUN_ID}" ]]; then
            echo "No successful QGIS submission was found for commit ${GITHUB_SHA}."
            echo "Submit this exact commit to qgis.org before creating the GitHub release."
            exit 1
          fi

          mkdir -p qgis-package
          gh run download "${QGIS_RUN_ID}" \
            --name "qgis2mapbender-${VERSION}-qgis-submission" \
            --dir qgis-package

          PACKAGE="$(find qgis-package -type f \
            -name "${PLUGIN_DIRECTORY}.${VERSION}.zip" -print -quit)"

          if [[ -z "${PACKAGE}" ]]; then
            echo "The QGIS submission artifact does not contain the expected package."
            exit 1
          fi

          SUBMISSION_COMMIT_FILE="$(find qgis-package -type f \
            -name "qgis-submission-commit.txt" -print -quit)"

          if [[ -z "${SUBMISSION_COMMIT_FILE}" ]] ||
            [[ "$(tr -d '\r\n' < "${SUBMISSION_COMMIT_FILE}")" != "${GITHUB_SHA}" ]]; then
            echo "The QGIS submission was not made from the tagged commit."
            exit 1
          fi

          echo "PACKAGE=${PACKAGE}" >> "${GITHUB_ENV}"

      - name: Validate submitted QGIS package
        env:
          PLUGIN_DIRECTORY: ${{ env.PLUGIN_DIRECTORY }}
        run: |
          unzip -l "${PACKAGE}" | grep -q "${PLUGIN_DIRECTORY}/metadata.txt"
          unzip -l "${PACKAGE}" | grep -q "${PLUGIN_DIRECTORY}/LICENSE"

          python - "${PACKAGE}" "${PLUGIN_DIRECTORY}" "${VERSION}" <<'PY'
          import configparser
          import sys
          import zipfile
          from io import StringIO

          package_path, plugin_directory, expected_version = sys.argv[1:]
          metadata_path = f"{plugin_directory}/metadata.txt"

          with zipfile.ZipFile(package_path) as package:
              metadata = package.read(metadata_path).decode("utf-8")

          parser = configparser.ConfigParser()
          parser.optionxform = str
          parser.read_file(StringIO(metadata))

          actual_version = parser["general"]["version"].strip()
          if actual_version != expected_version:
              raise SystemExit(
                  f"Package metadata version is {actual_version!r}, "
                  f"expected {expected_version!r}."
              )
          PY

          if unzip -l "${PACKAGE}" | grep -Eq '(^|/)__pycache__/|\.py[co]$'; then
            echo "The package contains generated Python cache files."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${PACKAGE}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes