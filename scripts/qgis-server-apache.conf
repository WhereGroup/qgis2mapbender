# QGIS Server endpoint aliases for Apache.
#
# Copy this file to /etc/apache2/conf-available/qgis_server.conf and adjust
# the paths for the target system or container. The wrapper receives only the
# project name and schema from the public WMS request.

SetEnv PGSERVICEFILE /data/config/pg_service.conf
FcgidInitialEnv PGSERVICEFILE /data/config/pg_service.conf

ScriptAlias /qgis/ "/data/bin/qgis_mapserv_wrapper.sh"

<Directory "/data/bin/">
    AllowOverride None
    Options +ExecCGI -Indexes
    Require all granted
</Directory>

<Location "/qgis/">
    Require all granted
</Location>
